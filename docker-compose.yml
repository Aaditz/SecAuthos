services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [db]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secauthos
      POSTGRES_USER: secauthos
      POSTGRES_PASSWORD: secauthos
    volumes: [postgres_data:/var/lib/postgresql/data]
volumes:
  postgres_data:
